[package]
name = "template"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "MCP server and CLI for template"
license = "MIT"
keywords = ["mcp", "model-context-protocol"]
publish = false

[lib]
name = "template"
path = "src/lib.rs"

[[bin]]
name = "template-server"
path = "src/main.rs"

[[bin]]
name = "template"
path = "src/cli.rs"

[dependencies]
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rmcp = { version = "3.10", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "signal", "io-std", "time"] }
tokio-util = "0.7"

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rmcp = { version = "3.10", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }

[profile.release]
strip = true
lto = "thin"
